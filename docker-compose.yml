version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=${DATABASE_URL:-sqlite:///instance/app.db}
    restart: always

