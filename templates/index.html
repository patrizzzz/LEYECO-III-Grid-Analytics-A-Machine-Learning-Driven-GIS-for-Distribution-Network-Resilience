{% extends "base.html" %}

{% block title %}Electrical Post Map{% endblock %}

{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
{% endblock %}

{% block breadcrumb %}
<nav class="breadcrumbs" aria-label="Breadcrumb">
  <ol class="breadcrumbs__list">
    <li class="breadcrumbs__item">
      <a href="/" class="breadcrumbs__link">Home</a>
    </li>
    <li class="breadcrumbs__item breadcrumbs__item--active" aria-current="page">Map</li>
  </ol>
</nav>
{% endblock %}

{% block content %}
<div class="map-header">
  <h1>Electrical Network Map</h1>
  <div class="map-actions" id="map-actions">
  </div>
</div>
<div id="network-geometry-hint"
  style="display: none; margin-bottom: 8px; padding: 10px 14px; background: #fef3c7; border: 1px solid #f59e0b; border-radius: 8px; font-size: 0.9rem; color: #92400e;">
</div>
<div id="map" style="min-height: 420px; height: calc(100vh - 240px); width: 100%; background: #e4e8ec;"></div>
{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
<script>
  // Extract URL parameters for post location navigation
  const params = new URLSearchParams(window.location.search);
  window._targetPostId = params.get('id');
  window._targetLat = parseFloat(params.get('lat'));
  window._targetLng = parseFloat(params.get('lng'));
  window._targetTransformerId = params.get('select');
</script>
<script src="/static/js/main.js"></script>

{% endblock %}
