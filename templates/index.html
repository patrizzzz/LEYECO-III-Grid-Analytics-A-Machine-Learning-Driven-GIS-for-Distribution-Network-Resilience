{% extends "base.html" %}

{% block title %}Electrical Post Map{% endblock %}

{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
{% endblock %}


{% block content %}
<div class="map-header">
  <h1>Electrical Network Map</h1>
  <div class="map-actions" id="map-actions">
  </div>
</div>
<div id="network-geometry-hint"
  style="display: none; margin-bottom: 8px; padding: 10px 14px; background: #fef3c7; border: 1px solid #f59e0b; border-radius: 8px; font-size: 0.9rem; color: #92400e;">
</div>
<div id="map" style="min-height: 420px; height: calc(100vh - 140px); width: 100%; background: #e4e8ec; border-radius: var(--radius-lg); box-shadow: var(--shadow-md);"></div>
{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
  // Extract URL parameters for post location navigation
  const params = new URLSearchParams(window.location.search);
  window._targetPostId = params.get('id');
  window._targetLat = parseFloat(params.get('lat'));
  window._targetLng = parseFloat(params.get('lng'));
  window._targetTransformerId = params.get('select');
</script>
<script src="/static/js/main.js"></script>

{% endblock %}
