{% extends "auth_base.html" %}

{% block title %}LEYECO III - Sign In{% endblock %}

{% block content %}
<style>
  .login-card {
    max-width: 380px;
  }

  .role-selector {
    display: flex;
    gap: 0;
    margin-bottom: 28px;
    background: var(--background);
    border-radius: 10px;
    padding: 4px;
    border: 1px solid var(--border);
  }

  .role-btn {
    flex: 1;
    padding: 10px 14px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    letter-spacing: 0.01em;
  }

  .role-btn.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
  }

  .role-btn:not(.active):hover {
    background: rgba(37, 99, 235, 0.08);
    color: var(--primary);
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 7px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .form-input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 0.95rem;
    font-family: inherit;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-sizing: border-box;
    background: var(--surface-raised, #f8fafc);
    color: var(--text-primary);
  }

  .form-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    background: var(--surface);
  }

  .form-input::placeholder {
    color: var(--text-muted, #94a3b8);
  }

  .password-group {
    position: relative;
  }

  .password-toggle-btn {
    position: absolute;
    right: 12px;
    top: 36px;
    background: none;
    border: none;
    color: var(--text-muted, #94a3b8);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s;
  }

  .password-toggle-btn:hover {
    color: var(--primary);
  }

  .password-toggle-btn svg {
    width: 18px;
    height: 18px;
  }

  .error-text {
    color: var(--danger, #dc2626);
    font-size: 0.85rem;
    margin-top: 4px;
    font-weight: 500;
  }

  .error-banner {
    background: var(--danger-light, #fee2e2);
    color: #991b1b;
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 0.9rem;
    font-weight: 500;
    border-left: 3px solid var(--danger, #dc2626);
  }

  .submit-btn {
    width: 100%;
    padding: 12px 14px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
    letter-spacing: 0.01em;
  }

  .submit-btn:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--primary-dark), #1a3a8f);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
  }

  .submit-btn:active:not(:disabled) {
    transform: translateY(0);
  }

  .submit-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .footer-text {
    margin-top: 28px;
    text-align: center;
    color: var(--text-muted, #94a3b8);
    font-size: 0.82rem;
    line-height: 1.5;
  }

  body.dark-theme .role-selector {
    background: rgba(255, 255, 255, 0.05);
    border-color: var(--border);
  }

  body.dark-theme .role-btn.active {
    background: var(--primary);
    color: #fff;
  }

  body.dark-theme .form-input {
    background: rgba(255, 255, 255, 0.05);
    border-color: var(--border);
  }

  body.dark-theme .form-input:focus {
    background: rgba(255, 255, 255, 0.08);
  }
</style>

{% if error %}
<div class="error-banner" role="alert">{{ error }}</div>
{% endif %}

<form method="post" action="/login" id="login-form" novalidate>
  <!-- Role Selector -->
  <div class="role-selector" role="radiogroup" aria-label="Account type">
    <button type="button" class="role-btn active" data-role="admin" aria-pressed="true">Admin</button>
    <button type="button" class="role-btn" data-role="viewer" aria-pressed="false">Viewer</button>
  </div>

  <!-- Username Field (common to both roles) -->
  <div class="form-group">
    <label for="username" class="form-label">Username</label>
    <input id="username" name="username" type="text" class="form-input" required autocomplete="username"
      placeholder="Enter your username" />
  </div>

  <!-- Admin: Password Row -->
  <div class="form-group password-group" id="password-row">
    <label for="password" class="form-label">Password</label>
    <input id="password" name="password" type="password" class="form-input" autocomplete="current-password"
      placeholder="Enter your password" />
    <button type="button" class="password-toggle-btn" id="toggle-password" aria-label="Show password"
      title="Show password">
      <span aria-hidden="true">👁️</span>
    </button>
  </div>

  <!-- Viewer: Access Code Row -->
  <div class="form-group" id="access-row" hidden>
    <label for="access_code" class="form-label">Access Code</label>
    <input id="access_code" name="access_code" type="text" class="form-input" autocomplete="one-time-code"
      placeholder="Enter your access code" />
  </div>

  <!-- Submit Button -->
  <button type="submit" class="submit-btn" id="submit-btn">Sign in</button>

  <!-- Footer -->
  <div class="footer-text">
    Internal LEYECO III system.<br>Accounts are managed by administrators.
  </div>
</form>

{% block scripts %}
<script>
  (function () {
    const form = document.getElementById('login-form');
    const roleButtons = document.querySelectorAll('.role-btn');
    const passwordRow = document.getElementById('password-row');
    const accessRow = document.getElementById('access-row');
    const passwordInput = document.getElementById('password');
    const accessInput = document.getElementById('access_code');
    const usernameInput = document.getElementById('username');
    const submitBtn = document.getElementById('submit-btn');
    const toggleBtn = document.getElementById('toggle-password');

    let currentRole = 'admin';

    // Role selector logic
    roleButtons.forEach(btn => {
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        const role = this.dataset.role;

        // Update button states
        roleButtons.forEach(b => {
          b.classList.toggle('active', b.dataset.role === role);
          b.setAttribute('aria-pressed', b.dataset.role === role ? 'true' : 'false');
        });

        // Clear inputs when switching roles
        usernameInput.value = '';
        passwordInput.value = '';
        accessInput.value = '';
        passwordInput.type = 'password';
        toggleBtn.textContent = '👁️';
        toggleBtn.setAttribute('aria-label', 'Show password');

        // Update form visibility
        if (role === 'admin') {
          passwordRow.hidden = false;
          accessRow.hidden = true;
          passwordInput.required = true;
          accessInput.required = false;
          submitBtn.textContent = 'Sign in';
          usernameInput.focus();
        } else {
          passwordRow.hidden = true;
          accessRow.hidden = false;
          passwordInput.required = false;
          accessInput.required = true;
          submitBtn.textContent = 'Access Dashboard';
          usernameInput.focus();
        }

        currentRole = role;
        // Hidden input for role
        let roleInput = form.querySelector('input[name="login_type"]');
        if (!roleInput) {
          roleInput = document.createElement('input');
          roleInput.type = 'hidden';
          roleInput.name = 'login_type';
          form.appendChild(roleInput);
        }
        roleInput.value = role;
      });
    });

    // Password visibility toggle
    toggleBtn.addEventListener('click', function (e) {
      e.preventDefault();
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      document.getElementById('eye-show').style.display = isPassword ? 'none' : 'block';
      document.getElementById('eye-hide').style.display = isPassword ? 'block' : 'none';
      toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      toggleBtn.setAttribute('title', isPassword ? 'Hide password' : 'Show password');
    });

    // Form submission
    form.addEventListener('submit', function (e) {
      const username = usernameInput.value.trim();

      if (!username) {
        e.preventDefault();
        usernameInput.focus();
        return;
      }

      if (currentRole === 'admin') {
        if (!passwordInput.value) {
          e.preventDefault();
          passwordInput.focus();
          return;
        }
      } else {
        if (!accessInput.value.trim()) {
          e.preventDefault();
          accessInput.focus();
          return;
        }
      }

      // Disable button during submission
      submitBtn.disabled = true;
      submitBtn.textContent = currentRole === 'admin' ? 'Signing in...' : 'Accessing...';
    });

    // Initialize
    usernameInput.focus();

    // Set initial hidden role input
    let roleInput = document.createElement('input');
    roleInput.type = 'hidden';
    roleInput.name = 'login_type';
    roleInput.value = 'admin';
    form.appendChild(roleInput);
  })();
</script>
{% endblock %}
{% endblock %}
